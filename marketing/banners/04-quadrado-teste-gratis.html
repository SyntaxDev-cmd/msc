<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>zMusic — Teste grátis (quadrado 1080×1080)</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1080px;
    background: radial-gradient(circle at 15% 10%, #22d3ee 0%, transparent 38%), radial-gradient(circle at 90% 20%, #ec4899 0%, transparent 40%),
      radial-gradient(circle at 70% 95%, #6d28d9 0%, transparent 55%), linear-gradient(135deg, #4c1d95, #7c3aed 45%, #312e81); }
  .rings { position: absolute; right: -260px; top: 120px; width: 900px; height: 900px; border-radius: 50%; z-index: -1;
    background: repeating-radial-gradient(circle, rgba(255,255,255,.10) 0 2px, transparent 2px 46px); mask-image: radial-gradient(circle, #000 30%, transparent 70%); }
  .top { position: absolute; left: 70px; right: 70px; top: 64px; display: flex; justify-content: space-between; align-items: center; }
  .top .logo b i { background: none; color: #fff; }
  .gift { display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 999px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.25);
    font-size: 22px; font-weight: 700; backdrop-filter: blur(10px); }
  .gift svg { width: 26px; height: 26px; color: #fde68a; }
  .kicker { position: absolute; left: 70px; top: 226px; font: 800 28px Sora, Inter; letter-spacing: .14em; text-transform: uppercase; color: #fff; opacity: .9; }
  .big { position: absolute; left: 62px; top: 282px; font-family: Sora, Inter; font-weight: 800; letter-spacing: -.055em; line-height: .95; font-size: 184px; color: #fff;
    text-shadow: 0 20px 60px rgba(40,0,90,.45); }
  .big span { display: block; }
  .big .o { background: linear-gradient(100deg, #fef3c7, #fde68a 40%, #fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 18px 40px rgba(60,0,90,.45)); }
  .lead { position: absolute; left: 70px; top: 652px; width: 520px; font-size: 36px; font-weight: 600; line-height: 1.3; color: rgba(255,255,255,.92); letter-spacing: -.01em; }
  .lead b { color: #fff; }
  .phone { right: 40px; top: 520px; width: 360px; transform: rotate(12deg); box-shadow: 0 0 0 2px rgba(255,255,255,.15), 0 60px 120px -30px rgba(20,0,60,.9); }
  .bottom { position: absolute; left: 70px; bottom: 70px; z-index: 3; }
  .cta { font-size: 38px; padding: 24px 24px 24px 46px; }
  .cta .arrow { width: 66px; height: 66px; } .cta .arrow svg { width: 30px; }
  .bottom .url { display: block; margin-top: 18px; font-size: 26px; color: rgba(255,255,255,.9); }
</style></head>
<body><div class="canvas">
  <div class="rings"></div><div class="grain"></div>
  <div class="top"><span data-logo="60"></span><span class="gift"><span data-icon="gift"></span>Indique um amigo e ganhe desconto</span></div>

  <div class="kicker">Sem cartão · sem anúncios</div>
  <div class="big"><span>TESTE</span><span class="o">GRÁTIS</span></div>
  <p class="lead">Qualquer música tocando na hora — <b>até com a tela apagada.</b></p>

  <div class="phone" data-shot="library.png"></div>

  <div class="bottom">
    <span class="cta white">Criar conta grátis <span class="arrow" data-icon="arrow"></span></span>
    <span class="url">zmusic.zcloudpro.sbs</span>
  </div>
</div>
<script src="parts.js"></script>
</body></html>
