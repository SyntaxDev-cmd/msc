<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>zMusic — Plano mensal (story 1080×1920) · use ?p=10, ?p=15 ou ?p=20</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1080px; height: 1920px; }
  .logo-wrap { position: absolute; top: 262px; left: 0; right: 0; text-align: center; }
  .head { position: absolute; top: 370px; left: 60px; right: 60px; text-align: center; }
  .head .h { font-size: 82px; }
  .plan { position: absolute; left: 90px; right: 90px; top: 620px; padding: 60px 56px 50px; text-align: center;
    background: linear-gradient(160deg, rgba(139,92,246,.5), rgba(34,211,238,.16)); border: 2px solid rgba(167,139,250,.9);
    box-shadow: 0 50px 120px -30px rgba(139,92,246,.85), inset 0 1px 0 rgba(255,255,255,.25); }
  .plan .name { font-size: 30px; color: #fff; }
  .plan .price { justify-content: center; font-size: 250px; margin-top: 0; }
  .plan .day { font-size: 30px; font-weight: 700; color: #fde68a; margin-top: -10px; }
  .plan ul { margin: 40px auto 0; width: max-content; text-align: left; gap: 18px; padding-top: 36px; border-top: 1px solid rgba(255,255,255,.15); }
  .plan li { font-size: 32px; }
  .plan li .ck { width: 36px; height: 36px; background: #fff; color: #6d28d9; } .plan li .ck svg { width: 20px; height: 20px; }
  .bottom { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; }
  .cta { font-size: 44px; padding: 26px 26px 26px 56px; }
  .cta .arrow { width: 76px; height: 76px; } .cta .arrow svg { width: 34px; }
  .bottom .note { display: block; margin-top: 26px; font-size: 28px; color: var(--muted); font-weight: 600; }
  .bottom .note b { color: #fde68a; }
</style></head>
<body><div class="canvas">
  <div class="glow" style="width:900px;height:900px;background:#7c3aed;left:90px;top:640px;opacity:.55"></div>
  <div class="glow" style="width:520px;height:520px;background:#06b6d4;right:-240px;top:120px;opacity:.35"></div>
  <div class="glow" style="width:520px;height:520px;background:#db2777;left:-240px;bottom:200px;opacity:.3"></div>
  <div class="grid-lines"></div><div class="grain"></div>

  <div class="logo-wrap"><span data-logo="64"></span></div>
  <div class="head"><h1 class="h">Sem anúncios por<br><span class="gt">menos que um café.</span></h1></div>

  <div class="plan">
    <span class="ribbon">Acesso completo</span>
    <div class="name">Plano mensal</div>
    <div class="price"><span class="cur">R$</span><span data-price>15</span><span class="per">/mês</span></div>
    <div class="day" data-day="só R$ {d} por dia"></div>
    <ul data-checks="Zero anúncios|Toca com a tela apagada|Ouça offline|Letra sincronizada|Playlists e artistas favoritos"></ul>
  </div>

  <div class="bottom">
    <span class="cta">Quero o meu <span class="arrow" data-icon="arrow"></span></span>
    <span class="note">🎁 <b>Teste grátis</b> antes de pagar</span>
  </div>
</div>
<script src="parts.js"></script>
</body></html>
