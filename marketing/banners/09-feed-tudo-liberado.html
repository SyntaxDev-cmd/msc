<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>zMusic — Tudo liberado (feed 1080×1350) · use ?p=10, ?p=15 ou ?p=20</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --gold: linear-gradient(100deg, #fff3c4 0%, #f6d27a 35%, #d4a23c 70%, #f9e0a0 100%); }
  .canvas { width: 1080px; height: 1350px; background: radial-gradient(circle at 75% 35%, #2a2112 0%, #0a0907 55%), #070605; }
  .lines { position: absolute; inset: 0; z-index: -1; opacity: .35;
    background: repeating-linear-gradient(115deg, rgba(246,210,122,.07) 0 2px, transparent 2px 60px); mask-image: radial-gradient(ellipse at 70% 40%, #000, transparent 70%); }
  .gold { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top { position: absolute; left: 70px; right: 70px; top: 66px; display: flex; justify-content: space-between; align-items: center; }
  .top .logo b i { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .crown { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(246,210,122,.5); font: 800 20px Sora, Inter; letter-spacing: .14em; color: #f6d27a; }
  .kick { position: absolute; left: 70px; top: 200px; font: 800 30px Sora, Inter; letter-spacing: .3em; text-transform: uppercase; }
  .head { position: absolute; left: 66px; top: 250px; width: 620px; }
  .head .h { font-size: 112px; color: #fff; }
  .price { position: absolute; left: 70px; top: 520px; display: flex; align-items: flex-start; font-family: Sora, Inter; font-weight: 800; letter-spacing: -.06em; line-height: 1; }
  .price .cur { font-size: 64px; margin: 34px 8px 0 0; letter-spacing: 0; }
  .price .n { font-size: 210px; }
  .price .per { font: 700 36px Inter; color: #cbb98a; align-self: flex-end; margin: 0 0 40px 10px; letter-spacing: 0; }
  .day { position: absolute; left: 74px; top: 740px; font-size: 26px; font-weight: 600; color: #cbb98a; }
  .feats { position: absolute; left: 70px; top: 810px; display: grid; gap: 16px; }
  .feats div { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; color: #f5efe0; }
  .feats .ck { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #f6d27a, #b8862b); color: #1a1307; flex: none; }
  .feats .ck svg { width: 20px; height: 20px; }
  .phone { right: 34px; top: 300px; width: 380px; transform: rotate(8deg);
    background: linear-gradient(145deg, #e8c77a, #6b4e1a 30%, #2a1f0c 60%, #c9a352);
    box-shadow: 0 0 0 2px rgba(246,210,122,.35), 0 80px 140px -40px #000; }
  .bottom { position: absolute; left: 70px; right: 70px; bottom: 74px; display: flex; align-items: center; gap: 26px; z-index: 3; }
  .cta { font-size: 38px; padding: 22px 22px 22px 46px; background: var(--gold); color: #1a1307; box-shadow: 0 24px 60px -18px rgba(246,210,122,.6), inset 0 1px 0 rgba(255,255,255,.6); }
  .cta .arrow { width: 64px; height: 64px; background: #1a1307; color: #f6d27a; } .cta .arrow svg { width: 30px; }
  .bottom small { font-size: 24px; color: #cbb98a; font-weight: 600; line-height: 1.3; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(180deg, transparent, #070605 55%); z-index: 2; }
</style></head>
<body><div class="canvas">
  <div class="glow" style="width:700px;height:700px;background:#b8862b;right:-160px;top:200px;opacity:.35"></div>
  <div class="lines"></div><div class="grain"></div>

  <div class="top"><span data-logo="60"></span><span class="crown">♛ ACESSO VIP</span></div>
  <div class="kick gold">Plano mensal</div>
  <div class="head"><h1 class="h">Tudo<br><span class="gold">liberado.</span></h1></div>
  <div class="price gold"><span class="cur">R$</span><span class="n" data-price>20</span><span class="per">/mês</span></div>
  <div class="day" data-day="só R$ {d} por dia"></div>

  <div class="feats">
    <div><span class="ck" data-icon="check"></span>Toca com a tela apagada</div>
    <div><span class="ck" data-icon="check"></span>Biblioteca sem limite</div>
    <div><span class="ck" data-icon="check"></span>Ouça offline</div>
    <div><span class="ck" data-icon="check"></span>Zero anúncios</div>
  </div>

  <div class="phone" data-shot="following.png"></div>
  <div class="shade"></div>

  <div class="bottom">
    <span class="cta">Quero o meu <span class="arrow" data-icon="arrow"></span></span>
    <small>🎁 Teste grátis<br>antes de pagar</small>
  </div>
</div>
<script src="parts.js"></script>
</body></html>
