<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>zMusic — App para Android (horizontal 1920×1080)</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1920px; height: 1080px; }
  .left { position: absolute; left: 120px; top: 0; bottom: 0; width: 860px; display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .left .h { font-size: 100px; margin-top: 40px; white-space: nowrap; }
  .left .sub { font-size: 32px; margin-top: 26px; width: 740px; }
  .chips { display: flex; flex-wrap: nowrap; gap: 12px; margin-top: 34px; }
  .chips .pill { font-size: 22px; padding: 12px 20px; white-space: nowrap; }
  .chips .pill svg { width: 24px; height: 24px; color: #67e8f9; }
  .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 42px; }
  .cta { font-size: 34px; padding: 20px 20px 20px 36px; white-space: nowrap; }
  .cta .arrow { width: 62px; height: 62px; } .cta .arrow svg { width: 30px; }
  .cta .ic { width: 36px; height: 36px; display: inline-grid; } .cta .ic svg { width: 36px; }
  .acts .url { font-size: 24px; line-height: 1.35; white-space: nowrap; } .acts .url b { display: block; color: #fff; font-size: 28px; }
  .phones { position: absolute; right: 60px; top: 0; bottom: 0; width: 900px; }
  .p1 { left: 40px; top: 200px; width: 340px; transform: rotate(-12deg); z-index: 1; filter: brightness(.85); }
  .p2 { left: 290px; top: 110px; width: 380px; transform: rotate(0deg); z-index: 3; }
  .p3 { left: 560px; top: 200px; width: 340px; transform: rotate(12deg); z-index: 2; filter: brightness(.85); }
  .floor { position: absolute; right: 120px; bottom: -40px; width: 900px; height: 160px; background: radial-gradient(ellipse, rgba(139,92,246,.55), transparent 70%); filter: blur(30px); z-index: 0; }
</style></head>
<body><div class="canvas">
  <div class="glow" style="width:900px;height:900px;background:#7c3aed;right:0;top:80px;opacity:.55"></div>
  <div class="glow" style="width:600px;height:600px;background:#0891b2;left:-200px;top:-200px;opacity:.35"></div>
  <div class="glow" style="width:500px;height:500px;background:#db2777;left:700px;bottom:-300px;opacity:.25"></div>
  <div class="grid-lines"></div><div class="grain"></div>

  <div class="left">
    <div data-logo="72"></div>
    <h1 class="h">O app de música<br><span class="gt">sem anúncios.</span></h1>
    <p class="sub">Qualquer música toca na hora, com letra, playlists e os artistas que você segue — até com a tela apagada.</p>
    <div class="chips">
      <span class="pill"><span data-icon="noads"></span>Zero anúncios</span>
      <span class="pill"><span data-icon="lock"></span>Tela apagada</span>
      <span class="pill"><span data-icon="offline"></span>Offline</span>
      <span class="pill"><span data-icon="lyrics"></span>Letra ao vivo</span>
    </div>
    <div class="acts">
      <span class="cta"><span class="ic" data-icon="android"></span> Baixe o app para Android <span class="arrow" data-icon="arrow"></span></span>
      <span class="url">Teste grátis em <b style="display:inline">zmusic.zcloudpro.sbs</b></span>
    </div>
  </div>

  <div class="phones">
    <div class="floor"></div>
    <div class="phone p1" data-shot="following.png"></div>
    <div class="phone p2" data-shot="np.png"></div>
    <div class="phone p3" data-shot="home.png"></div>
  </div>
</div>
<script src="parts.js"></script>
</body></html>
