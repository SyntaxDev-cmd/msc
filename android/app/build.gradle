plugins {
    id 'com.android.application'
}

def siteUrl = (project.findProperty('zmusic.siteUrl') ?: 'https://zmusic.zcloudpro.sbs/').toString()
if (!siteUrl.endsWith('/')) siteUrl += '/'
def siteHost = new URI(siteUrl).host
def appName = (project.findProperty('zmusic.appName') ?: 'zMusic').toString()

// Assinatura: keystore.properties (fora do git) — sem ele o APK sai sem assinatura (assine com apksigner)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'sbs.zcloudpro.zmusic'
    compileSdk 36

    defaultConfig {
        applicationId 'sbs.zcloudpro.zmusic'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
        resValue 'string', 'app_name', appName
        manifestPlaceholders = [siteHost: siteHost]
    }

    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks['storeFile']) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
